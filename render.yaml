databases:
  - name: mohamed-alhaj-legal-db
    databaseName: mohamed_alhaj_legal_db
    user: mohamed_alhaj_legal_db_user
    plan: free
    region: frankfurt
    postgresMajorVersion: 18

services:
  - type: web
    name: mohamed-alhaj-legal-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mohamed-alhaj-legal-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1-mini
      - key: PYTHON_VERSION
        value: 3.12.8
